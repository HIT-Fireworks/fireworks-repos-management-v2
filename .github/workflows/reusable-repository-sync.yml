name: Validate managed repository

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate base metadata
        run: test -f repository.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate native Rust manager and no-code UI
        run: cargo test --locked --manifest-path repository-tui/Cargo.toml
      - name: Smoke-test native runtime with automatic workspace discovery
        run: cargo run --quiet --locked --manifest-path repository-tui/Cargo.toml -- --check > /dev/null
      - name: Ensure native runtime has no Python subprocess seam
        shell: bash
        run: |
          if grep -R -E 'Command::new\("python|fireworks_manager_core|CoreClient' repository-tui/src; then
            echo "Rust production runtime still depends on Python"
            exit 1
          fi
      - name: Validate offline Python generators and behavior oracle
        run: |
          python -m py_compile scripts/*.py tests/*.py
          python -m unittest tests/test_fireworks_manager_core.py
          python -m unittest tests/test_fireworks_manager_state_machine.py tests/test_repository_management.py
