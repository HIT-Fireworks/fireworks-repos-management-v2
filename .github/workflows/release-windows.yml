name: Build Windows repository manager
on:
  workflow_dispatch:
  push:
    tags: ['manager-v*']
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: repository-tui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: cargo test --locked --manifest-path repository-tui/Cargo.toml
      - run: cargo build --release --locked --manifest-path repository-tui/Cargo.toml
      - name: Package and verify complete snapshot
        run: python scripts/package-windows.py
      - uses: actions/upload-artifact@v5
        with:
          name: windows-manager
          path: dist/fireworks-repository-manager-windows.zip
          retention-days: 7
  publish:
    if: startsWith(github.ref, 'refs/tags/manager-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-manager
      - name: Publish tagged package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" fireworks-repository-manager-windows.zip --verify-tag --generate-notes --title "薪火仓库管理 $TAG"
