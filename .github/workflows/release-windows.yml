name: Build Windows repository manager

on:
  workflow_dispatch:
  push:
    tags:
      - "manager-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run native Rust tests
        run: cargo test --locked --manifest-path repository-tui/Cargo.toml
      - name: Build single executable
        run: cargo build --release --locked --manifest-path repository-tui/Cargo.toml
      - name: Assemble no-code package
        shell: pwsh
        run: |
          $package = "dist/薪火仓库管理-Windows"
          New-Item -ItemType Directory -Force "$package/config", "$package/data" | Out-Null
          Copy-Item "repository-tui/target/release/repository-tui.exe" "$package/薪火仓库管理.exe"
          Copy-Item "启动薪火仓库管理.cmd" "$package/启动薪火仓库管理.cmd"
          Copy-Item "config/repository-topology.v4.json" "$package/config/repository-topology.v4.json"
          Copy-Item "config/repository-file-routes.v4.json" "$package/config/repository-file-routes.v4.json"
          Copy-Item "data/repository-manifest.no-collection.v4.json" "$package/data/repository-manifest.no-collection.v4.json"
          foreach ($directory in @("data", "config")) {
            $shards = "$directory/.fireworks-json"
            if (Test-Path $shards) {
              Copy-Item $shards "$package/$directory/.fireworks-json" -Recurse
            }
          }
          @"
          薪火仓库管理

          1. 完整解压 ZIP。
          2. 双击“启动薪火仓库管理.cmd”。
          3. 使用方向键选择，Enter 确认，Esc 返回。

          查看仓库和现有数据完全离线可用。
          更新教务数据时，程序会打开独立的 Microsoft Edge 或 Google Chrome 登录窗口；无需复制 Cookie。专用登录状态由浏览器保存在本机应用数据目录，不读取日常浏览器配置，也不另存明文 Cookie。
          同步 Registry 或远端仓库时，系统检查页会提示是否需要 Git 或 GitHub 登录。
          "@ | Set-Content -Encoding utf8 "$package/请先看我.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/fireworks-repository-manager-windows.zip" -Force
      - uses: actions/upload-artifact@v5
        with:
          name: 薪火仓库管理-Windows
          path: dist/fireworks-repository-manager-windows.zip
      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/fireworks-repository-manager-windows.zip" --generate-notes --title "薪火仓库管理 ${{ github.ref_name }}"
