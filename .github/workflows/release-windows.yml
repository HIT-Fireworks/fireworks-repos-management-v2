name: Build Windows easy-use package

on:
  workflow_dispatch:
  push:
    tags:
      - "easy-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Run native Rust tests
        run: cargo test --locked --manifest-path repository-tui/Cargo.toml
      - name: Build single executable
        run: cargo build --release --locked --manifest-path repository-tui/Cargo.toml
      - name: Assemble no-code package
        shell: pwsh
        run: |
          $package = "dist/薪火资料管理-Windows"
          New-Item -ItemType Directory -Force "$package/config", "$package/data" | Out-Null
          Copy-Item "repository-tui/target/release/repository-tui.exe" "$package/薪火资料管理.exe"
          Copy-Item "启动薪火资料管理.cmd" "$package/启动薪火资料管理.cmd"
          Copy-Item "config/repository-topology.v4.json" "$package/config/repository-topology.v4.json"
          Copy-Item "config/repository-file-routes.v4.json" "$package/config/repository-file-routes.v4.json"
          Copy-Item "data/repository-manifest.no-collection.v4.json" "$package/data/repository-manifest.no-collection.v4.json"
          @"
          薪火资料管理

          1. 完整解压 ZIP。
          2. 双击“启动薪火资料管理.cmd”。
          3. 使用方向键选择，Enter 确认，Esc 返回。

          查看资料无需安装其他软件。
          合并或拆分资料时，系统检查页会提示是否需要安装 Git 或登录 GitHub。
          "@ | Set-Content -Encoding utf8 "$package/请先看我.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/薪火资料管理-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: 薪火资料管理-Windows
          path: dist/薪火资料管理-Windows.zip
      - name: Attach package to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/薪火资料管理-Windows.zip" --generate-notes --title "薪火资料管理 ${{ github.ref_name }}"
