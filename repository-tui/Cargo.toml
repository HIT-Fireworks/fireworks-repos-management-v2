[package]
name = "repository-tui"
version = "0.1.0"
edition = "2021"
description = "无需编程即可使用的 HIT-Fireworks 仓库管理工具"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
unicode-normalization = "0.1"
unicode-width = "0.2"
